
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Secret Love Story ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px;text-align:center;
 font-family:Arial,sans-serif;color:white;
 background:radial-gradient(circle at 20% 20%,#d68ac9,transparent 40%),
 linear-gradient(135deg,#21132f,#68375f,#301a48);
}
.card{
 width:100%;max-width:390px;padding:38px 25px;
 border:1px solid #ffffff55;border-radius:28px;
 background:#ffffff18;backdrop-filter:blur(18px);
 box-shadow:0 0 35px #f4a5e566;
}
.icons{display:flex;align-items:center;justify-content:center;gap:15px}
.key{font-size:55px}.heart{font-size:65px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.17)}}
h1{font-size:29px;color:#ffe4f6}
p{color:#f9dff1;line-height:1.6}
input{
 width:100%;padding:16px;border:1px solid #ffc0e6;
 border-radius:14px;margin:18px 0;text-align:center;font-size:16px;
}
button{
 padding:15px 28px;border:0;border-radius:30px;
 background:linear-gradient(120deg,#ff91c9,#c77be9);
 color:white;font-size:16px;font-weight:bold;cursor:pointer;
}
#message{min-height:24px;color:#ffe0f4}
.note{font-size:12px;color:#f4d4ec;margin-top:22px}
</style>
</head>
<body>
<div class="card">
 <div class="icons"><span class="key">🔐</span><span class="heart">💗</span></div>
 <h1>A Secret Love Story</h1>
 <p>A beautiful world of our memories is waiting for you.
 Enter your special password to unlock it. ❤️</p>

 <input type="password" id="pass"
 placeholder="Enter your secret password">

 <button id="unlockButton" onclick="unlock()">
 Unlock My Love ❤️
 </button>

 <p id="message"></p>
 <div class="note">A little surprise made with love ♡</div>
</div>

<script>
const FUNCTION_URL =
"https://xeaqfpkyosdkjwybwqxk.supabase.co/functions/v1/birthday-gallery";

const PUBLIC_KEY =
"sb_publishable_jrKT49Jjgw8ivlUdvK0tJg_hLyc078b";

async function unlock(){
 const password=document.getElementById("pass").value.trim();
 const message=document.getElementById("message");
 const button=document.getElementById("unlockButton");

 if(!password){
  message.textContent="Please enter your password ❤️";
  return;
 }

 button.disabled=true;
 button.textContent="Checking your password...";

 try{
  const response=await fetch(FUNCTION_URL,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":PUBLIC_KEY,
    "Authorization":"Bearer "+PUBLIC_KEY
   },
   body:JSON.stringify({action:"list",password:password})
  });

  const result=await response.json();

  if(!response.ok){
   throw new Error(result.error || "Incorrect password.");
  }

  sessionStorage.setItem("galleryPassword",password);
  window.location.href="open.html";

 }catch(error){
  message.textContent=error.message || "Connection failed. Try again.";
  button.disabled=false;
  button.textContent="Unlock My Love ❤️";
 }
}
</script>
</body>
</html>
