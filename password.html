
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Secret Love Story ❤️</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(circle at 20% 20%,#d68ac9,transparent 40%),
 linear-gradient(135deg,#21132f,#68375f,#301a48);
 font-family:Arial,sans-serif;
 color:white;
 text-align:center;
 padding:20px;
}

.card{
 width:100%;
 max-width:390px;
 padding:38px 25px;
 border:1px solid #ffffff55;
 border-radius:28px;
 background:#ffffff18;
 backdrop-filter:blur(18px);
 box-shadow:0 0 35px #f4a5e566;
}

/* KEY AND HEART POSITION */
.icons{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:15px;
 margin-bottom:18px;
}

.key{
 font-size:55px;
}

.heart{
 font-size:65px;
 animation:heartbeat 1.2s infinite;
}

@keyframes heartbeat{
 0%,100%{transform:scale(1)}
 50%{transform:scale(1.17)}
}

h1{
 font-size:29px;
 color:#ffe4f6;
 margin:10px 0;
 text-shadow:0 0 15px #ffb3e6;
}

p{
 color:#f9dff1;
 line-height:1.6;
}

input{
 width:100%;
 padding:16px;
 border:1px solid #ffc0e6;
 border-radius:14px;
 margin:18px 0;
 text-align:center;
 font-size:16px;
 outline:none;
 background:#fff;
 color:#442344;
}

button{
 padding:15px 28px;
 border:0;
 border-radius:30px;
 background:linear-gradient(120deg,#ff91c9,#c77be9);
 color:white;
 font-size:16px;
 font-weight:bold;
 box-shadow:0 0 22px #ff9ad6;
 cursor:pointer;
}

button:active{
 transform:scale(.96);
}

#message{
 color:#ffe0f4;
 min-height:20px;
 font-size:14px;
}

.note{
 font-size:12px;
 color:#f4d4ec;
 margin-top:22px;
}
</style>
</head>

<body>

<div class="card">

 <div class="icons">
  <span class="key">🔐</span>
  <span class="heart">💗</span>
 </div>

 <h1>A Secret Love Story</h1>

 <p>
  A beautiful world of our memories is waiting for you.
  Enter your special password to unlock it. ❤️
 </p>

 <input
  type="password"
  id="pass"
  placeholder="Enter your secret password"
 >

 <button onclick="unlock()">
  Unlock My Love ❤️
 </button>

 <p id="message"></p>

 <div class="note">
  A little surprise made with love ♡
 </div>

</div>

<script>
function unlock(){

 const password =
 document.getElementById("pass").value.trim();

 if(password === ""){
  document.getElementById("message").textContent =
  "Please enter your password ❤️";
  return;
 }

 window.location.href = "open.html";
}
</script>

</body>
</html>
