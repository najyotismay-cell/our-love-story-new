
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Love Password ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 background:linear-gradient(135deg,#160b2d,#571b54);
 color:white;font-family:Arial,sans-serif;text-align:center;
}
.card{
 width:90%;max-width:380px;padding:30px 22px;
 background:#ffffff12;border:1px solid #ffffff30;
 border-radius:24px;box-shadow:0 10px 40px #0005;
}
.heart{font-size:65px}
h1{font-size:27px}
p{color:#f5d8ef}
input{
 width:100%;padding:15px;border-radius:12px;
 border:1px solid #ff8ac5;margin:15px 0;
 font-size:16px;text-align:center;
}
button{
 padding:14px 28px;border:0;border-radius:25px;
 background:#ff5caa;color:white;font-size:16px;
 font-weight:bold;
}
#message{color:#ffb5d8}
</style>
</head>
<body>
<div class="card">
 <div class="heart">🔐❤️</div>
 <h1>A Secret Love Story</h1>
 <p>Enter your special password to unlock the memories.</p>
 <input id="pass" type="password" placeholder="Enter secret password">
 <br>
 <button onclick="unlock()">Unlock My Love ❤️</button>
 <p id="message"></p>
</div>
<script>
function unlock(){
 document.getElementById("message").textContent =
 "Password system will be connected to your private story storage next. ❤️";
}
</script>
</body>
</html>
