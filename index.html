
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#160b2d,#4b164c,#160b2d);
  color:white;font-family:Arial,sans-serif;text-align:center;
  overflow:hidden;
}
.card{padding:30px 22px;max-width:420px;width:90%}
.heart{font-size:85px;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.2)}}
h1{font-size:38px;margin:15px 0}
p{color:#f4d9f0;line-height:1.7}
button{
  background:#ff5caa;color:white;border:0;
  padding:15px 28px;border-radius:30px;
  font-size:17px;font-weight:bold;
  box-shadow:0 0 25px #ff5caa;cursor:pointer;
}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>Our Love Story</h1>
  <p>A little world made with love,<br>just for someone special.</p>
  <p>Every memory has a beautiful story.</p>
  <button onclick="alert('Our special journey begins ❤️')"
    onclick="window.location.href='password.html'"
    Begin Our Journey ✨
  </button>
</div>
</body>
</html>
